<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <style>
      .box { fill:#161b22; stroke:#30363d; stroke-width:1.5; }
      .gpu { fill:#0b3d1a; stroke:#76b900; stroke-width:1.5; }
      .t1 { font-family:Arial,sans-serif; font-size:16px; fill:#e6edf3; font-weight:bold; }
      .t2 { font-family:Arial,sans-serif; font-size:13px; fill:#8b949e; }
      .t3 { font-family:monospace; font-size:12px; fill:#76b900; }
      .tc { font-family:monospace; font-size:12px; fill:#b87333; }
      .arr { stroke:#4d7c0f; stroke-width:2; fill:none; marker-end:url(#ah); }
      .arr2 { stroke:#b87333; stroke-width:2; fill:none; marker-end:url(#ah2); stroke-dasharray:6,4; }
      .arr3 { stroke:#58a6ff; stroke-width:2; fill:none; marker-end:url(#ah3); stroke-dasharray:2,3; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4d7c0f"/>
    </marker>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b87333"/>
    </marker>
    <marker id="ah3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#0d1117" rx="10"/>
  <text x="500" y="32" class="t1" text-anchor="middle" font-size="20">Architecture — Flash-Next NVFP4 on 4× V100 (TP4, 2+2 NVLink + PLX)</text>

  <!-- client -->
  <rect x="60" y="60" width="200" height="60" class="box" rx="8"/>
  <text x="160" y="85" class="t1" text-anchor="middle">OpenAI client</text>
  <text x="160" y="105" class="t2" text-anchor="middle">agent harness / chat / WebUI</text>

  <!-- vllm -->
  <rect x="400" y="55" width="260" height="70" class="box" rx="8"/>
  <text x="530" y="82" class="t1" text-anchor="middle">1Cat-vLLM 1.5.0</text>
  <text x="530" y="102" class="t2" text-anchor="middle">OpenAI server :8000 · TP4</text>
  <path d="M260 90 L395 90" class="arr"/>

  <!-- fast routes -->
  <rect x="720" y="55" width="230" height="70" class="box" rx="8"/>
  <text x="835" y="80" class="t1" text-anchor="middle">SM70 fast routes</text>
  <text x="835" y="100" class="t3" text-anchor="middle">GEMV · fused HC · fused GDN</text>
  <path d="M665 90 L715 90" class="arr"/>

  <!-- MoE -->
  <rect x="400" y="150" width="260" height="56" class="box" rx="8"/>
  <text x="530" y="174" class="t1" text-anchor="middle">MoE target model · MTP OFF</text>
  <text x="530" y="194" class="t2" text-anchor="middle">NVFP4 weights · routed experts 512/top-10</text>
  <path d="M530 125 L530 145" class="arr2"/>

  <!-- PLE offload -->
  <rect x="60" y="150" width="230" height="56" class="box" rx="8"/>
  <text x="175" y="174" class="t1" text-anchor="middle">PLE tables ~52 GB FP8</text>
  <text x="175" y="194" class="t2" text-anchor="middle">pinned in RAM (CPU offload)</text>
  <path d="M295 178 L395 178" class="arr3"/>

  <!-- GPUs 2x2 -->
  <g>
    <rect x="90" y="280" width="380" height="105" class="gpu" rx="10"/>
    <text x="280" y="308" class="t1" text-anchor="middle">V100 #1 + #2 — NVLink NV5 (×5)</text>
    <text x="280" y="330" class="t3" text-anchor="middle">SM70 · 900 GB/s HBM2 each · 22.0 GiB weights + KV fp16</text>
    <text x="280" y="352" class="t2" text-anchor="middle">pair all-reduce over NVLink (fast)</text>
    <rect x="125" y="362" width="150" height="14" rx="3" fill="#76b900" opacity="0.25"/>
    <rect x="285" y="362" width="150" height="14" rx="3" fill="#76b900" opacity="0.25"/>
    <text x="200" y="373" class="t2" text-anchor="middle" font-size="10">22.0 GiB</text>
    <text x="360" y="373" class="t2" text-anchor="middle" font-size="10">22.0 GiB</text>
  </g>
  <g>
    <rect x="530" y="280" width="380" height="105" class="gpu" rx="10"/>
    <text x="720" y="308" class="t1" text-anchor="middle">V100 #3 + #4 — NVLink NV6 (×6)</text>
    <text x="720" y="330" class="t3" text-anchor="middle">SM70 · 900 GB/s HBM2 each · 22.0 GiB weights + KV fp16</text>
    <text x="720" y="352" class="t2" text-anchor="middle">pair all-reduce over NVLink (fast)</text>
    <rect x="565" y="362" width="150" height="14" rx="3" fill="#76b900" opacity="0.25"/>
    <rect x="725" y="362" width="150" height="14" rx="3" fill="#76b900" opacity="0.25"/>
    <text x="640" y="373" class="t2" text-anchor="middle" font-size="10">22.0 GiB</text>
    <text x="800" y="373" class="t2" text-anchor="middle" font-size="10">22.0 GiB</text>
  </g>

  <path d="M470 206 C 420 240, 340 250, 285 275" class="arr"/>
  <path d="M590 206 C 640 240, 680 250, 715 275" class="arr"/>

  <!-- cross-pair -->
  <path d="M470 332 L525 332" class="arr2"/>
  <text x="498" y="322" class="tc" text-anchor="middle" font-size="11">PLX — P2P deadlocks</text>

  <!-- host SHM -->
  <rect x="330" y="440" width="340" height="70" class="box" rx="8"/>
  <text x="500" y="468" class="t1" text-anchor="middle">Host: 2× Xeon E5-2680 v2 (2013) · 251 GB DDR3</text>
  <text x="500" y="490" class="t2" text-anchor="middle">cross-pair all-reduce falls back to SHM through RAM · P2P restricted to NVLink (NCCL_P2P_LEVEL=NVL)</text>
  <path d="M280 385 C 320 420, 380 430, 420 438" class="arr2"/>
  <path d="M720 385 C 680 420, 620 430, 580 438" class="arr2"/>

  <text x="500" y="540" class="t2" text-anchor="middle">KV cache fp16: 5.51 GiB/GPU · pool 439,700 tokens · custom all-reduce DISABLED (livelocks on PLX)</text>
</svg>
