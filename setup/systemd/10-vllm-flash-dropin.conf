[Service]
# Keep the API key in one place (mode 600), never in the unit:
# EnvironmentFile=%h/.config/vllm/apikey.env
#
# PR #415 opt-in fast routes (all default-OFF upstream, contract-qualified:
# TP4 + no speculative decoding). +13% decode measured (41 -> 46 tok/s).
Environment=VLLM_SM70_QWEN38_FP16_GEMV=1
Environment=VLLM_SM70_QWEN38_FUSED_HC_FP16=1
Environment=VLLM_SM70_QWEN38_FUSED_GDN_INPUT_FP16=1
#
# TP4 over 2 NVLink pairs + PLX: vLLM's custom all-reduce spin-waits
# (100% GPU, frozen boot). NCCL init is fine -> communicate via NCCL.
#
# This drop-in IS the authoritative config: it clears ExecStart and replaces it.
ExecStart=
ExecStart=/mnt/nvme/1cat-vllm/venv/bin/vllm serve /mnt/nvme/models/dealignai-abliterated \
  --served-model-name qwen3.8-flash-next \
  --trust-remote-code \
  --language-model-only \
  --dtype half \
  --tensor-parallel-size 4 \
  --attention-backend FLASH_ATTN_V100 \
  --max-model-len 262144 \
  --max-num-seqs 4 \
  --max-num-batched-tokens 8192 \
  --gpu-memory-utilization 0.92 \
  --host 0.0.0.0 \
  --port 8000 \
  --disable-custom-all-reduce \
  --enable-auto-tool-choice --tool-call-parser qwen3_coder \
  --api-key ${VLLM_API_KEY}
