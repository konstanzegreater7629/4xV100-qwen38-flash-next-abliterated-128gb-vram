[Service]
Environment=NCCL_DEBUG=INFO
Environment=NCCL_DEBUG_SUBSYS=INIT,GRAPH,P2P
# P2P through the PLX bridge between the NVLink pairs passes NCCL init but
# deadlocks on the first collective (spin-wait at 100% GPU). Restrict P2P to
# the NVLink bonds; cross-pair traffic falls back to SHM via the host.
# NVLink inside each pair stays active.
#
# !!! systemd pitfall !!!
# `Environment=` lines ACCUMULATE across the main unit and drop-ins, and a
# COMMENTED-OUT line in a drop-in does NOT unset a variable from the main
# unit. If you want to change this, override it with an explicit value in a
# drop-in (or edit the main unit) — then re-measure against the CONC-B
# baseline before keeping it.
Environment=NCCL_P2P_LEVEL=NVL
