[Service]
# Triton compiles a small C launcher on first run and needs Python.h, which
# is missing on a stock Ubuntu box without python3.12-dev (and no sudo here).
# Headers from any ABI-compatible conda python package work:
Environment=CPATH=/home/USER/miniforge3/pkgs/python-3.12.14-h5f976f7_2_cpython/include/python3.12
Environment=LIBRARY_PATH=/home/USER/miniforge3/pkgs/python-3.12.14-h5f976f7_2_cpython/lib
